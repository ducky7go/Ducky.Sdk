name: Nuget Release

on:
  push:
    # Publish semver tags as releases.
    tags: ["*.*.*"]
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: tree:0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          # Look to see if there is a cache hit for the corresponding requirements file
          key: ${{ runner.os }}-nuget-${{ hashFiles('Sdk/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.x"

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
        with:
          configFilePath: GitVersion.yml

      - name: Fetch build dependencies
        run: bash scripts/fetch_build_dependency.sh

      - name: Extract version from tag or GitVersion
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # For tag builds, use the tag name (formal release)
            VERSION="${GITHUB_REF#refs/tags/}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_dev=false" >> $GITHUB_OUTPUT
            echo "Using tag version: $VERSION"
          else
            # For main branch builds, use fullSemVer which includes commit count
            # Format: X.Y.Z-dev.N where N is commits since last tag
            VERSION="${{ steps.gitversion.outputs.fullSemVer }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is_dev=true" >> $GITHUB_OUTPUT
            echo "Using GitVersion dev build: $VERSION"
            echo "SemVer: ${{ steps.gitversion.outputs.semVer }}"
            echo "InformationalVersion: ${{ steps.gitversion.outputs.informationalVersion }}"
          fi

      - name: Build and pack using packToLocal script
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # Modify packToLocal to output to artifacts instead of duckylocal
          mkdir -p ./artifacts
          bash scripts/packToLocal.sh --version "$VERSION" --configuration Release --no-clear-cache
          # Copy from duckylocal to artifacts for upload/publish
          cp duckylocal/Ducky.Sdk.${VERSION}.nupkg ./artifacts/
          if [ -f duckylocal/Ducky.Sdk.${VERSION}.snupkg ]; then
            cp duckylocal/Ducky.Sdk.${VERSION}.snupkg ./artifacts/
          fi
          echo "Generated packages:"
          ls -lh ./artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages-${{ steps.get_version.outputs.version }}
          path: ./artifacts/*.nupkg
          retention-days: 30

      - name: Push to MyGet (tags and main branch)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: |
          dotnet nuget push ./artifacts/*.nupkg -k ${{ secrets.MYGET_API_KEY }} -s https://www.myget.org/F/ducky/api/v3/index.json --skip-duplicate

      - name: NuGet login (OIDC -> temp API key)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: NuGet/login@v1
        id: login
        with:
          user: newbe36524

      - name: Push to NuGet (Trusted Publishing, tags and main branch)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          dotnet nuget push ./artifacts/*.nupkg -k ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
